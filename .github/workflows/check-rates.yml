name: Check Mortgage Rates

on:
  schedule:
    # 13:00 UTC = 6 AM PDT / 5 AM PST. GitHub only guarantees scheduled runs on a
    # best-effort basis and routinely starts them 1-4 hours late, so treat this
    # as "some time that morning" rather than an appointment.
    - cron: '0 13 * * *'
  workflow_dispatch:       # Manual trigger

permissions:
  contents: write

# Two runs committing to main at once would race on push.
concurrency:
  group: check-rates
  cancel-in-progress: false

jobs:
  check-rates:
    runs-on: ubuntu-latest
    env:
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
      LOAN_AMOUNT: ${{ vars.LOAN_AMOUNT }}
      ESTIMATED_VALUE: ${{ vars.ESTIMATED_VALUE }}
      STATE: ${{ vars.STATE }}
      ZIPCODE: ${{ vars.ZIPCODE }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check rates
        working-directory: src
        run: python check_rates.py

      - name: Commit updated rates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/last_rates.json
          if git diff --staged --quiet; then
            echo "No change to commit"
            exit 0
          fi
          git commit -m "Update mortgage rates [skip ci]"
          git pull --rebase --autostash
          git push

      # Runs on any failure above, including a failed pip install or a broken
      # import, which is why it is stdlib-only and does not import the main script.
      - name: Notify on failure
        if: failure()
        working-directory: src
        run: python3 notify_failure.py
